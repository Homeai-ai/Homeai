<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOMEAI - AI Image Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0d12;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #252936;
      background: #10131b;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #8b5cf6;
    }

    .credits {
      background: #1c202b;
      border: 1px solid #303544;
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #8b5cf6;
    }

    .hero p {
      color: #9ca3af;
      font-size: 16px;
    }

    .generator {
      background: #11141d;
      border: 1px solid #292e3a;
      border-radius: 20px;
      padding: 22px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      background: #0b0d12;
      color: white;
      border: 1px solid #303544;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    .options {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    select {
      flex: 1;
      min-width: 140px;
      background: #191d27;
      color: white;
      border: 1px solid #303544;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .preview {
      margin-top: 25px;
      min-height: 300px;
      border-radius: 18px;
      border: 1px dashed #343947;
      background: #0d1017;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .preview-text {
      color: #737987;
    }

    .preview img {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 14px;
    }

    .status {
      text-align: center;
      color: #a1a1aa;
      margin-top: 14px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #666b78;
      padding: 30px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      main {
        padding: 30px 14px;
      }

      .generator {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">HOME<span>AI</span></div>
    <div class="credits">✨ 50 Credits</div>
  </header>

  <main>

    <section class="hero">
      <h1>Create with <span>HOMEAI</span></h1>
      <p>Turn your imagination into beautiful AI images.</p>
    </section>

    <section class="generator">

      <textarea
        id="prompt"
        placeholder="Describe the image you want...&#10;&#10;Example: A cute cartoon boy walking through a futuristic city">
      </textarea>

      <div class="options">

        <select id="style">
          <option value="Realistic">Realistic</option>
          <option value="3D">3D</option>
          <option value="Anime">Anime</option>
          <option value="Cartoon">Cartoon</option>
          <option value="Cinematic">Cinematic</option>
        </select>

        <select id="ratio">
          <option value="1:1">Square 1:1</option>
          <option value="9:16">Portrait 9:16</option>
          <option value="16:9">Landscape 16:9</option>
        </select>

      </div>

      <button onclick="generateImage()">
        ✨ Generate Image
      </button>

      <div class="preview" id="preview">
        <div class="preview-text">
          Your generated image will appear here.
        </div>
      </div>

      <div class="status" id="status">
        Ready to create.
      </div>

    </section>

  </main>

  <footer>
    © 2026 HOMEAI · AI Image Generator
  </footer>

  <script>

    function generateImage() {

      const prompt = document.getElementById("prompt").value.trim();
      const style = document.getElementById("style").value;
      const ratio = document.getElementById("ratio").value;

      const preview = document.getElementById("preview");
      const status = document.getElementById("status");

      if (!prompt) {
        status.innerText = "Please enter a prompt first.";
        return;
      }

      status.innerText = "Preparing your image...";

      preview.innerHTML = `
        <div class="preview-text">
          ✨ HOMEAI is preparing your ${style} image...<br><br>
          <small>Aspect ratio: ${ratio}</small>
        </div>
      `;

      setTimeout(() => {

        preview.innerHTML = `
          <div class="preview-text">
            🚀 Image generation engine will be connected here.<br><br>
            Your prompt:<br>
            <strong>${prompt}</strong>
          </div>
        `;

        status.innerText = "Prototype ready — AI engine coming next.";

      }, 1200);

    }

  </script>

</body>
</html>
